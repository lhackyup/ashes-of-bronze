<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASHES OF BRONZE: The Iron Dawn (1200 BC)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&display=swap');

    :root {
      --cyclopean-dark: #1b1612;
      --cyclopean-mid: #382f27;
      --cyclopean-light: #5a4c3f;
      --bronze-gold: #c9933b;
      --bronze-bright: #ffd166;
      --tin-silver: #a0a8b0;
      --copper-green: #2de0a5;
      --sea-peoples-red: #8c1919;
      --obsidian-black: #0c0a08;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--obsidian-black);
      color: #f7efe1;
      font-family: 'Crimson Pro', Georgia, serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .stone-panel {
      background: linear-gradient(160deg, #42382f 0%, #29221c 55%, #171310 100%);
      border-top: 2px solid var(--bronze-gold);
      border-left: 2px solid var(--bronze-gold);
      border-right: 2px solid #100d0a;
      border-bottom: 2px solid #100d0a;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.7), 0 2px 6px rgba(0,0,0,0.8);
    }

    .svga-btn {
      background: linear-gradient(180deg, #5c4d3e 0%, #3d3227 50%, #261f18 100%);
      border-top: 2px solid var(--bronze-gold);
      border-left: 2px solid var(--bronze-gold);
      border-right: 2px solid #14100c;
      border-bottom: 2px solid #14100c;
      border-radius: 3px;
      color: #fff6e5;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 8px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }

    .svga-btn:hover {
      background: linear-gradient(180deg, #786450 0%, #4d3f32 50%, #30271f 100%);
      color: var(--bronze-bright);
    }

    .svga-btn:active {
      transform: translateY(1px);
    }

    #top-bar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      gap: 12px;
      z-index: 10;
      flex-shrink: 0;
    }

    .resource-strip {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .res-pill {
      display: flex;
      flex-direction: column;
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(18, 14, 11, 0.7);
      border: 1px solid #4a3e33;
      min-width: 75px;
    }

    .res-label {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      color: #b5a691;
    }

    .res-val {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--bronze-bright);
    }

    #advisor-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      height: 42px;
      padding: 2px 10px;
      border-radius: 3px;
      overflow: hidden;
    }

    #advisor-portrait {
      width: 36px;
      height: 36px;
      border: 2px solid var(--bronze-gold);
      border-radius: 3px;
      background: radial-gradient(circle, #7a5c37, #241b12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-weight: bold;
      color: var(--bronze-bright);
      font-size: 14px;
      flex-shrink: 0;
    }

    #advisor-text {
      font-size: 15px;
      font-weight: 600;
      color: #f7e6b5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #main-container {
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100% - 52px);
      overflow: hidden;
    }

    #viewport-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      background: #090807;
      overflow: hidden;
      cursor: crosshair;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #090807;
    }

    #sidebar {
      width: 320px;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 8px;
      z-index: 10;
      flex-shrink: 0;
    }

    #minimap-frame {
      padding: 4px;
      border-radius: 4px;
    }

    #minimap-canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      max-height: 200px;
      display: block;
      border: 1px solid var(--bronze-gold);
    }

    #inspector-panel {
      padding: 8px;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 110px;
    }

    #inspector-name {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 13px;
      color: var(--bronze-bright);
    }

    #inspector-desc {
      font-size: 12px;
      color: #cfc2af;
      line-height: 1.2;
    }

    .hp-bar-bg {
      width: 100%;
      height: 6px;
      background: #1c0909;
      border: 1px solid #4a3e33;
      border-radius: 2px;
      overflow: hidden;
    }

    #inspector-hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #2b9348, #55a630);
      width: 100%;
    }

    #inspector-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    #build-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6px;
      gap: 4px;
    }

    .panel-title {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: bold;
      color: var(--bronze-gold);
      border-bottom: 1px solid #4a3e33;
      padding-bottom: 2px;
    }

    #build-items-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      overflow-y: auto;
      padding: 4px 2px;
    }

    .build-btn {
      text-align: center;
      padding: 6px 4px;
    }
  </style>
</head>
<body>
  <!-- TOP RESOURCES & ADVISOR BAR -->
  <header id="top-bar" class="stone-panel">
    <div class="resource-strip">
      <div class="res-pill">
        <span class="res-label">Copper</span>
        <span id="val-copper" class="res-val" style="color: #2de0a5;">0</span>
      </div>
      <div class="res-pill">
        <span class="res-label">Tin</span>
        <span id="val-tin" class="res-val" style="color: #c0c6cc;">0</span>
      </div>
      <div class="res-pill">
        <span class="res-label">Iron</span>
        <span id="val-iron" class="res-val" style="color: #e07a5f;">0</span>
      </div>
      <div class="res-pill">
        <span class="res-label">Grain</span>
        <span id="val-grain" class="res-val" style="color: #ffd166;">0</span>
      </div>
      <div class="res-pill">
        <span class="res-label">Supply</span>
        <span id="val-supply" class="res-val">0/20</span>
      </div>
    </div>

    <!-- ADVISOR NOTIFICATION BOX -->
    <div id="advisor-box" class="stone-panel">
      <div id="advisor-portrait">BK</div>
      <div id="advisor-text">Burna-Khabir: Silence falls upon the Aegean. Fortify the coast...</div>
    </div>
  </header>

  <!-- MAIN CONTAINER: VIEWPORT + SIDEBAR -->
  <main id="main-container">
    <section id="viewport-wrapper">
      <canvas id="game-canvas"></canvas>
    </section>

    <!-- RIGHT SVGA SIDEBAR -->
    <aside id="sidebar" class="stone-panel">
      <!-- RADAR MINIMAP -->
      <div id="minimap-frame">
        <canvas id="minimap-canvas" width="200" height="200"></canvas>
      </div>

      <!-- SELECTION INSPECTOR -->
      <div id="inspector-panel" class="stone-panel" style="display: none;">
        <div id="inspector-name">Entity</div>
        <div class="hp-bar-bg">
          <div id="inspector-hp-fill"></div>
        </div>
        <div id="inspector-desc">Detailed entity description...</div>
        <div id="inspector-actions"></div>
      </div>

      <!-- BUILD PANEL -->
      <div id="build-panel" class="stone-panel">
        <div class="panel-title">Cyclopean Works & Forge</div>
        <div id="build-items-container"></div>
      </div>
    </aside>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
